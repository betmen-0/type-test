<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content=""width=device-width , initial-scale="1.0" />
        <meta http-equiv="X-UA-compatible" content="IE-edge"/>
        <title>TYPE-E-Meter</title>
        <link rel="stylesheet" href="style.css"/>
        <script src="https://kit.fontawesome.com/d733855d1a.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="showbox">
            <div class="loader">
                <svg class="circular" viewBox="25 25 50 50">
                    <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10"/>
                </svg>
            </div>
        </div>

        <div class="nav-container">
            <ul>
                <li class="heading">TYPE-E-METER</li>
            </ul>
        </div>
        <div class="wrapper">
            <h4 class="heading head">TYPING SPEED TEST</h4>
            <h1 class="main-head head">Test Your Typing Skills</h1>
            <div class="center">
                <div class="clock inline"><i class="fas fa-clock"></i></div>
                <div class="nav-links inline test-options">
                    <div class="time-modes modes show-time-modes">Time Modes</div>
                    <div class="options">
                        <a href="#time-modes">
                            <span class="time-modes modes option hide" id="minute1">
                            <span class="bold time">1</span>min </span>
                        </a>
                        <a href="#time-modes">
                            <span class="time-modes modes option hide" id="minute2">
                                <span class="bold time">2</span>min
                            </span>
                        </a>
                        <a href="#time-modes">
                            <span class="time-modes modes option hide" id="minute3">
                                <span class="bold time">3</span>min
                            </span>
                        </a>
                    </div>
                    <a href="#infinity-modes">
                        <div class="infinity-modes modes" id="infinity-modes-btn">
                            Infinity Mode
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
